name: Deploy Laravel to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip, bcmath, fileinfo
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install NPM dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Create deployment archive
        run: |
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='node_modules' \
              --exclude='tests' \
              --exclude='.env' \
              --exclude='*.tar.gz' \
              --exclude='storage/logs/*' \
              --exclude='storage/framework/cache/*' \
              --exclude='storage/framework/sessions/*' \
              --exclude='storage/framework/views/*' \
              --exclude='scraper/node_modules' \
              -czf ../deploy_package.tar.gz .
          mv ../deploy_package.tar.gz ./deploy_package.tar.gz

      - name: Upload package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT || 22 }}
          source: 'deploy_package.tar.gz'
          target: '/home/${{ secrets.USERNAME }}/'

      - name: Extract & execute post-deployment commands via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT || 22 }}
          script: |
            # Ensure target directory exists
            mkdir -p ${{ secrets.APP_PATH }}

            # Extract archive into APP_PATH
            tar -xzf /home/${{ secrets.USERNAME }}/deploy_package.tar.gz -C ${{ secrets.APP_PATH }}
            rm -f /home/${{ secrets.USERNAME }}/deploy_package.tar.gz

            cd ${{ secrets.APP_PATH }}

            # Ensure storage directories and permissions exist
            mkdir -p storage/app/public/blog-images
            mkdir -p storage/framework/{cache,sessions,views}
            mkdir -p storage/logs
            mkdir -p bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            # Link storage to public
            php artisan storage:link || true

            # Run database migrations
            php artisan migrate --force

            # Optimize & cache Laravel configuration and routes
            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear
            php artisan optimize

            # Filament Admin upgrades
            php artisan filament:upgrade || true
