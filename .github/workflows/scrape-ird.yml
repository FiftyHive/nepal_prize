name: IRD Prize Scraper

on:
  schedule:
    # Run every hour (adjust as needed)
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

jobs:
  scrape:
    name: Scrape IRD Prize Winners
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci

      - name: Install Playwright Chromium browser
        working-directory: scraper
        run: npx playwright install chromium --with-deps

      - name: Run IRD scraper
        id: scrape
        working-directory: scraper
        run: |
          node ird-scraper.js > ../scraper-output.json 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Display scraper output (for debugging)
        run: cat scraper-output.json

      - name: POST results to Laravel webhook
        env:
          WEBHOOK_URL: ${{ secrets.LARAVEL_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.LARAVEL_WEBHOOK_TOKEN }}
        run: |
          # Extract only the winners array and post to webhook
          WINNERS=$(cat scraper-output.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          # Filter to only valid winners (non-null dates)
          valid = [w for w in data.get('winners', []) if w.get('start_date') and w.get('end_date')]
          print(json.dumps({'winners': valid}))
          ")

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WEBHOOK_TOKEN}" \
            -d "$WINNERS" \
            "${WEBHOOK_URL}/api/scraper/receive")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "HTTP Response: $HTTP_CODE"
          echo "Response body: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Webhook POST failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Scrape and POST completed successfully"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::IRD scraper or webhook failed. Check logs above."
          # Add Slack/email notification here if needed
